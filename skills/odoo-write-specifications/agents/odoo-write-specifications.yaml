version: 1
display_name: Write Specifications
short_description: Interview stakeholders one question at a time and draft a concise, table-based .docx Odoo functional specification incrementally — the document grows on disk as each answer lands. Each spec gets its own folder under <repo>/specifications/<task-code> - <client> - <auto-derived-slug>/ (the .docx + a _reference/ builder). Claims about standard Odoo are checked against the target version's source. Optional finish-line hand-off to odoo-mock-design.
default_prompt: >
  Use the Write Specifications skill: read skills/odoo-write-specifications/SKILL.md
  and skills/_shared/principles.md, and follow SKILL.md — it is the single
  source for the question order, the free-text carve-outs (Q1, Q2, Q5), the
  source-grounding rule, the per-workflow role walk, the anchor pass and the
  finish-line mock offer. Do NOT enter plan mode (this skill is exempt from
  P11) and skip architecture detection (P13). Interview invariant on every
  turn: one atomic question per turn via AskUserQuestion (except the three
  free-text questions), never bundled. Edit SPEC_DATA in the spec's
  _reference/_build_<task-code>.py and re-run it after every answer; never
  hand-edit the docx. Run Stage 1 lint before declaring done.
