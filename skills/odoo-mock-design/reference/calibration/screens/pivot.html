<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Calibration — pivot</title>
<link rel="stylesheet" href="../../catalog/odoo.css">
<link rel="stylesheet" href="assets/odoo.css">
</head>
<body>
<!-- SPRITE -->
<div class="o_web_client">
<header class="o_navbar">
<nav class="o_main_navbar">
  <a class="o_menu_toggle hasImage" title="Home menu">
    <svg class="o_menu_toggle_icon" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
      <rect width="3" height="3" x="0" y="0"/><rect width="3" height="3" x="5" y="0"/><rect width="3" height="3" x="10" y="0"/>
      <rect width="3" height="3" x="0" y="5"/><rect width="3" height="3" x="5" y="5"/><rect width="3" height="3" x="10" y="5"/>
      <rect width="3" height="3" x="0" y="10"/><rect width="3" height="3" x="5" y="10"/><rect width="3" height="3" x="10" y="10"/>
    </svg>
    <svg class="o_menu_brand_icon"><use href="#o-app-sales"/></svg>
    <span class="o_menu_brand">Sales</span>
  </a>
  <div class="o_menu_sections" role="menu">
    <a class="o_nav_entry">Orders</a>
    <a class="o_nav_entry">Products</a>
    <a class="o_nav_entry">Reporting</a>
    <a class="o_nav_entry">Configuration</a>
  </div>
  <div class="o_menu_systray" role="menu">
    <button class="o_systray_item" title="Timesheet timer"><svg class="o_icon text-danger"><use href="#o-play-circle"/></svg></button>
    <button class="o_systray_item" title="Ask AI"><svg class="o_icon o_icon_ai"><use href="#o-app-ai"/></svg></button>
    <button class="o_systray_item" title="Messages">
      <svg class="o_icon"><use href="#o-forum"/></svg>
      <span class="badge">6</span>
    </button>
    <button class="o_systray_item" title="Activities">
      <svg class="o_icon"><use href="#o-clock"/></svg>
      <span class="badge">17</span>
    </button>
    <button class="o_systray_item" title="Toggle Studio"><svg class="o_icon"><use href="#o-studio"/></svg></button>
    <button class="o_systray_item o_switch_company_menu" title="YourCompany">
      <span class="oe_topbar_name">YourCompany</span>
    </button>
    <button class="o_systray_item o_user_menu" title="Mitchell Admin">
      <span class="o_user_avatar o_avatar_c5">M</span>
    </button>
  </div>
</nav>
</header>
<div class="o_action_manager">
<div class="o_control_panel">
  <div class="o_control_panel_main">
    <div class="o_control_panel_breadcrumbs">
      <div class="o_control_panel_main_buttons"></div>
      <div class="o_breadcrumb">
        <div class="o_last_breadcrumb_item active"><span>Sales Analysis</span></div>
        <div class="o_control_panel_breadcrumbs_actions">
          <div class="o_cp_action_menus">
            <button class="btn o_btn_circle btn-light" title="Actions"><svg class="o_icon"><use href="#o-ellipsis-v"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <div class="o_control_panel_actions">
      <div class="o_cp_searchview input-group rounded-pill" role="search">
        <div class="o_searchview form-control">
          <svg class="o_searchview_icon o_icon"><use href="#o-search"/></svg>
          <div class="o_searchview_input_container">
            <div class="o_searchview_facet">
              <div class="o_searchview_facet_label"><svg class="o_icon"><use href="#o-filter"/></svg></div>
              <div class="o_facet_values">
                <small class="o_facet_value">Sales Orders</small>
                <button class="o_facet_remove" title="Remove"><svg class="o_icon"><use href="#o-close-small"/></svg></button>
              </div>
            </div>
            <div class="o_searchview_facet">
              <div class="o_searchview_facet_label"><svg class="o_icon"><use href="#o-filter"/></svg></div>
              <div class="o_facet_values">
                <small class="o_facet_value">Order Date: Last 365 Days</small>
                <button class="o_facet_remove" title="Remove"><svg class="o_icon"><use href="#o-close-small"/></svg></button>
              </div>
            </div>
            <input type="text" class="o_searchview_input focus" placeholder="Search..."/>
          </div>
        </div>
        <button class="o_searchview_dropdown_toggler btn btn-outline-secondary" title="Toggle Search Panel"></button>
      </div>
    </div>
    <div class="o_control_panel_navigation">
      <nav class="o_cp_switch_buttons btn-group o_switcher">
        <button class="btn btn-secondary o_switch_view o_graph" title="Graph"><svg class="o_icon"><use href="#o-view-graph"/></svg></button>
        <button class="btn btn-secondary o_switch_view o_pivot active" title="Pivot"><svg class="o_icon"><use href="#o-view-pivot"/></svg></button>
        <button class="btn btn-secondary o_switch_view o_list" title="List"><svg class="o_icon"><use href="#o-view-list"/></svg></button>
      </nav>
    </div>
  </div>
</div>
<main class="o_content">
<div class="o_pivot_buttons">
  <div class="btn-group" role="toolbar" aria-label="Main actions">
    <button class="btn btn-primary o_report_measures">Measures <svg class="o_icon"><use href="#o-caret-down"/></svg></button>
  </div>
  <div class="btn-group" role="toolbar" aria-label="Spreadsheet">
    <button class="btn btn-secondary o_pivot_add_spreadsheet">Spreadsheet</button>
  </div>
  <div class="btn-group" role="toolbar" aria-label="Pivot settings">
    <button class="btn btn-secondary o_pivot_flip_button" title="Flip axis"><svg class="o_icon"><use href="#o-flip-axis"/></svg></button>
    <button class="btn btn-secondary o_pivot_expand_button" title="Expand all"><svg class="o_icon"><use href="#o-expand-all"/></svg></button>
    <button class="btn btn-secondary o_pivot_download" title="Download xlsx"><svg class="o_icon"><use href="#o-download"/></svg></button>
  </div>
</div>
<div class="o_pivot">
  <table class="table table-sm table-bordered">
    <thead>
      <tr>
        <th class="border-0 bg-100" rowspan="3"></th>
        <th class="o_pivot_header_cell_opened" colspan="2"><svg class="o_icon"><use href="#o-minus-box"/></svg><span>Total</span></th>
        <th class="border-0 bg-100" rowspan="2"></th>
      </tr>
      <tr>
        <th class="o_pivot_header_cell_closed"><svg class="o_icon"><use href="#o-add-box"/></svg><span>Sales</span></th>
        <th class="o_pivot_header_cell_closed"><svg class="o_icon"><use href="#o-add-box"/></svg><span>Pre-Sales</span></th>
      </tr>
      <tr>
        <th class="o_pivot_measure_row">Qty Ordered</th>
        <th class="o_pivot_measure_row">Qty Ordered</th>
        <th class="o_pivot_measure_row">Qty Ordered</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th class="o_pivot_header_cell_opened" style="padding-left:5px;"><svg class="o_icon"><use href="#o-minus-box"/></svg><span>Total</span></th>
        <td class="o_pivot_cell_value fw-bold">610.00</td><td class="o_pivot_cell_value fw-bold">26.00</td><td class="o_pivot_cell_value fw-bold">636.00</td>
      </tr>
      <tr>
        <th class="o_pivot_header_cell_closed" style="padding-left:35px;"><svg class="o_icon"><use href="#o-add-box"/></svg><span>September 2026</span></th>
        <td class="o_pivot_cell_value">363.00</td><td class="o_pivot_cell_value">12.00</td><td class="o_pivot_cell_value fw-bold">375.00</td>
      </tr>
      <tr>
        <th class="o_pivot_header_cell_closed" style="padding-left:35px;"><svg class="o_icon"><use href="#o-add-box"/></svg><span>October 2026</span></th>
        <td class="o_pivot_cell_value">247.00</td><td class="o_pivot_cell_value">14.00</td><td class="o_pivot_cell_value fw-bold">261.00</td>
      </tr>
    </tbody>
  </table>
</div>
</main>
</div>
</div>
</body>
</html>
