<!--
  dialog.html — Odoo 20 modal dialog (web/static/src/core/dialog/dialog.{xml,scss,js},
  core/confirmation_dialog/confirmation_dialog.xml, core/errors/error_dialogs.xml).

  Use for a wizard step, a confirmation prompt or a blocking error. Render
  it ON TOP of the underlying screen (inside the same .mock-screen, after the
  .o_web_client): the backdrop is 25% black + grayscale(50%), so the page
  behind stays readable but desaturated — never darken or blur it further.

  ===== TWO SHAPES — pick one per package, don't mix =====

  1. **Simplified catalog shape** (default — short and clear for mock work)
     `.o_dialog_backdrop > .o_dialog > .o_dialog_header / .o_dialog_body / .o_dialog_footer`

  2. **Real Odoo 20 shape** (dialog.xml 1:1 — for dev-facing mocks)
     `<div class="o_dialog">
        <div role="dialog" class="modal d-block o_technical_modal o_modal_design_minimal o_modal_body_padding">
          <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-sm">
            <div class="modal-content">
              <header class="modal-header">
                <h4 class="modal-title text-wrap text-break fs-3 flex-grow-1">…</h4>
                <button type="button" class="btn-close position-sm-absolute top-0 end-0" title="Close" aria-label="Close"></button>
              </header>
              <main class="modal-body">…</main>
              <footer class="modal-footer d-empty-none justify-content-around justify-content-md-start flex-wrap gap-2 w-100">…</footer>
            </div>
          </div>
        </div>
      </div>`
     lg / xl dialogs carry `o_modal_design_default` and a plain `btn-close`
     (no position classes); wizards / form dialogs / the Search More picker
     carry `o_modal_no_body_padding` (the hosted form brings its own padding).

  Both shapes share the same CSS and render identically.

  ===== SIZE DECIDES THE DESIGN (Odoo 20 Dialog.design) =====
  Size modifier on `.o_dialog` (simplified) or `.modal-dialog` (real):

    `.modal-sm`   460px  MINIMAL  ConfirmationDialog (Archive / Cancel / Reset
                                  prompts), AlertDialog, every UserError /
                                  ValidationError / warning dialog
    `.modal-md`   620px  MINIMAL  action context dialog_size='medium'; command
                                  palette; most POS popups
    (none) = lg   980px  DEFAULT  the Dialog default: every act_window wizard
                                  (target=new), form dialogs, the Select /
                                  "Search more..." picker (`.modal-lg` = same)
    `.modal-xl`  1140px  DEFAULT  only when the action context sets
                                  dialog_size='extra-large'

  MINIMAL = no header/footer rules, 24px padding, title 18.2px/500 black,
            the X pinned to the top-right corner.
  DEFAULT = ruled header + footer, 16px padding, X at the header's right end.
  A confirmation WITHOUT `modal-sm` renders as a 980px ruled wizard — always
  give prompts `modal-sm`.

  ===== HEADER =====
  Title is `<h4 class="modal-title">` (never a bold span). Every dialog has the
  X: `<button class="btn-close" type="button" title="Close" aria-label="Close"
  data-mock-modal-close></button>` (thin SVG X at 50% opacity — no "×" text).

  ===== FOOTER (load-bearing) =====
  LEFT-aligned, 8px gap, buttons in DOM order:
      <button class="btn btn-primary">Save</button>       ← FIRST = LEFTMOST
      <button class="btn btn-secondary">Discard</button>  ← then the white secondary
  Never right-align, never reverse the order, never `o_btn_outline` here.

  ===== CANONICAL ODOO 20 COPY =====
  - Archive:  title "Confirmation", body "Are you sure that you want to archive
              this record?", [Archive] [Discard]
  - Generic confirmation: [Ok] [Discard]
  - Delete:   title "Bye-bye, record!", body "Are you sure you want to delete
              this record?", [Delete] (btn-danger) [No, keep it]
  - Error titles come from the exception: UserError "Invalid Operation",
    ValidationError "Validation Error", AccessError "Access Error",
    MissingError "Missing Record", other warnings "Odoo Warning".
    Never "User Error"; never a red / yellow header bar.

  ===== USAGE MODES =====
  (a) **As its own walkthrough step** — a `.mock-screen` whose body is the
      base screen + this dialog always visible.
  (b) **As an IN-PLACE modal on an existing screen** — give the backdrop
      `data-mock-modal="ID"` (hidden until opened), open it from a button
      with `data-mock-modal-open="ID"`, close with `data-mock-modal-close`
      (the X, Discard — or Esc / a goto).

  Example (in-place):
    <button class="btn btn-secondary" data-mock-modal-open="confirm">Archive</button>
    <div class="o_dialog_backdrop" data-mock-modal="confirm">
      <div class="o_dialog modal-sm"> … footer buttons carry data-mock-modal-close
      (and optionally data-mock-goto="next-screen") … </div>
    </div>
-->

<!-- ===== Wizard (act_window target=new) — simplified shape, default size lg 980px ===== -->
<div class="o_dialog_backdrop">
  <div class="o_dialog">
    <div class="o_dialog_header">
      <h4 class="modal-title"><!-- SLOT: wizard title, e.g. Confirm Delivery --></h4>
      <button class="btn-close" type="button" title="Close" aria-label="Close" data-mock-modal-close></button>
    </div>
    <div class="o_dialog_body">
      <!-- SLOT: wizard fields. A full form (o_form_view) goes in an
           `.o_dialog_body.p-0` — the hosted form brings its own padding. -->
      <div class="o_inner_group">
        <div class="o_field_row">
          <label class="o_form_label">Delivery Date</label>
          <div class="o_field_widget">06/15/2026</div>
        </div>
      </div>
    </div>
    <div class="o_dialog_footer">
      <!-- PRIMARY first (leftmost), then btn-secondary — see header rules. -->
      <button class="btn btn-primary">Validate</button>
      <button class="btn btn-secondary" data-mock-modal-close>Discard</button>
    </div>
  </div>
</div>

<!-- ===== UserError / ValidationError (WarningDialog) — sm, minimal =====

  `.o_dialog_user_error` (or `.o_dialog_validation_error`) = a 460px minimal
  dialog: exception title, the X, the message, ONE left-aligned primary
  "Close". No coloured header, no right-aligned footer, no min-width.

  <div class="o_dialog_backdrop">
    <div class="o_dialog o_dialog_user_error">
      <div class="o_dialog_header">
        <h4 class="modal-title">Invalid Operation</h4>
        <button class="btn-close" type="button" title="Close" aria-label="Close" data-mock-modal-close></button>
      </div>
      <div class="o_dialog_body">
        <div role="alert"><p>Allocate lots or serials on every tracked line before confirming this quotation.</p></div>
      </div>
      <div class="o_dialog_footer">
        <button class="btn btn-primary o-default-button" data-mock-modal-close>Close</button>
      </div>
    </div>
  </div>
