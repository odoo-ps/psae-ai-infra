<!--
  map.html — Map view, Odoo 20 (enterprise web_map: map_renderer.{xml,js},
  map_controller.xml). The real view draws Leaflet tiles (external): a mock
  MUST NOT load tiles, so .o-map-renderer--container carries a CSS-only
  street-map placeholder. Render INSIDE .o_action_manager right after the
  control panel.

  CONTROL PANEL: Google Maps is a btn-secondary "Maps" right after New
  (MapView.Buttons, multicolour Google pin + "Maps") — it is NOT in the pin
  list any more. The MapBox-token banner is tenant config: never shown.

  LAYOUT (.o-map-renderer, `row g-0`):
    .o-map-renderer--container FIRST: white-framed map, 16px left inset,
      1px #dee2e6 border, no bottom border, 8px top radius. Leaflet zoom
      (+ / −) top-left 10px; attribution bottom-right.
      Markers (.o-map-pin): the 27x41 teal (#007E82) SVG teardrop with a
      white centre, NO number (a count appears only when several records
      share one point); grouped maps colour the pin per group. Position:
      inline left/top % = the pin's tip.
    .o-map-renderer--pin-list-container on the RIGHT (~280px, transparent
      on the gray page): .o-map-renderer--pin-list-search ("Search..."
      underline input + my_location button #o-my-location), then
      ul.o-map-renderer--pin-list-details of plain
      li.o-map-renderer--pin-clickable names (hover teal tint). No numbers,
      addresses or drag handles. Grouped: a gray
      .o-map-renderer--pin-list-group-header per group; records without
      coordinates go in an "Unlocated" group (#o-explore).
-->
<div class="o-map-renderer">
  <div class="o-map-renderer--container">
    <div class="o-map-zoom"><button title="Zoom in">+</button><button title="Zoom out">−</button></div>
    <span class="o-map-pin" style="left:30%; top:40%;"><svg width="27" height="41" viewBox="0 0 27 41"><ellipse cx="13.5" cy="34.8" rx="10.5" ry="5.25" fill="rgba(0,0,0,.15)"/><path fill="#007E82" d="M27,13.5C27,19.07 20.25,27 14.75,34.5C14.02,35.5 12.98,35.5 12.25,34.5C6.75,27 0,19.22 0,13.5C0,6.04 6.04,0 13.5,0C20.96,0 27,6.04 27,13.5Z"/><circle fill="white" cx="13.5" cy="13.5" r="6.5"/></svg></span>
    <span class="o-map-pin" style="left:56%; top:62%;"><svg width="27" height="41" viewBox="0 0 27 41"><ellipse cx="13.5" cy="34.8" rx="10.5" ry="5.25" fill="rgba(0,0,0,.15)"/><path fill="#007E82" d="M27,13.5C27,19.07 20.25,27 14.75,34.5C14.02,35.5 12.98,35.5 12.25,34.5C6.75,27 0,19.22 0,13.5C0,6.04 6.04,0 13.5,0C20.96,0 27,6.04 27,13.5Z"/><circle fill="white" cx="13.5" cy="13.5" r="6.5"/></svg></span>
    <span class="o-map-pin" style="left:72%; top:30%;"><svg width="27" height="41" viewBox="0 0 27 41"><ellipse cx="13.5" cy="34.8" rx="10.5" ry="5.25" fill="rgba(0,0,0,.15)"/><path fill="#007E82" d="M27,13.5C27,19.07 20.25,27 14.75,34.5C14.02,35.5 12.98,35.5 12.25,34.5C6.75,27 0,19.22 0,13.5C0,6.04 6.04,0 13.5,0C20.96,0 27,6.04 27,13.5Z"/><circle fill="white" cx="13.5" cy="13.5" r="6.5"/></svg></span>
    <span class="o-map-attribution"><a>Leaflet</a> | © <a>Mapbox</a> © <a>OpenStreetMap</a> <a><b>Improve this map</b></a></span>
  </div>
  <div class="o-map-renderer--pin-list-container">
    <div class="o-map-renderer--pin-list-search"><input class="o_input" placeholder="Search..."/><button class="btn btn-light" title="Center on my location"><svg class="o_icon"><use href="#o-my-location"/></svg></button></div>
    <ul class="o-map-renderer--pin-list-details">
      <li class="o-map-renderer--pin-clickable">Deco Addict</li>
      <li class="o-map-renderer--pin-clickable">Gemini Furniture</li>
      <li class="o-map-renderer--pin-clickable">Azure Interior</li>
    </ul>
  </div>
</div>
