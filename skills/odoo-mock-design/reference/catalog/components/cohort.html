<!--
  cohort.html — Cohort view, Odoo 20 (enterprise web_cohort:
  cohort_renderer.xml, cohort_controller.scss, cohort.variables.scss).
  Retention grid: one row per cohort (start period), one column per elapsed
  period. Render INSIDE .o_action_manager right after the control panel;
  the cohort's own toolbar is the first row of .o_cohort_renderer.

  STRUCTURE: div.o_cohort_renderer (the wrapper — NOT the table) >
    toolbar (`d-flex gap-1 px-3 py-2`; .o_cohort_buttons is a mock helper):
      Measures btn-primary ("Measures ▾" — cohort is multi-select, it never
      shows the measure name) · .btn-group.o_view_scale_selector "Week ▾" ·
      download icon button (.o_cohort_download_button, #o-download)
    table.o_data_table.table.table-bordered, full width, 14px:
      thead (2 rows, #f5f5f5): start-date th + measure th (rowspan 2), a
      "<Stop date> - By <Week>" th spanning the periods; then +0 … +N.
      tbody tr.o_cohort_row_clickable: two td.o_cohort_value, then one td
      per period holding div.o_cohort_highlight (4px margin + padding, 6px
      radius) with inline TEAL rgba(0,160,157,<pct/100>) — never brand.
      TEXT RULE (Odoo): color:#fff only when pct > 50, else inherit.
      Periods not reached yet are NOT rendered: the row simply ends early
      (only its bottom rule runs on) — no empty cells, no "—".
      tfoot (#f5f5f5, 500): "Average" row.
-->
<div class="o_cohort_view">
  <div class="o_cohort_renderer">
    <div class="o_cohort_buttons">
      <div class="btn-group" role="toolbar" aria-label="Main actions"><button class="btn btn-primary o_report_measures dropdown-toggle">Measures <svg class="o_icon"><use href="#o-caret-down"/></svg></button></div>
      <div class="btn-group o_view_scale_selector"><button class="btn btn-secondary dropdown-toggle">Week <svg class="o_icon"><use href="#o-caret-down"/></svg></button></div>
      <div class="btn-group"><button class="btn btn-secondary o_cohort_download_button" title="Download as Excel file"><svg class="o_icon"><use href="#o-download"/></svg></button></div>
    </div>
    <div class="table-responsive">
      <table class="o_data_table table table-bordered text-center">
        <thead>
          <tr><th rowspan="2">Created on</th><th rowspan="2">Count</th><th colspan="4">Closed Date - By Week</th></tr>
          <tr><th>+0</th><th>+1</th><th>+2</th><th>+3</th></tr>
        </thead>
        <tbody>
          <tr class="o_cohort_row_clickable">
            <td class="o_cohort_value">W38 2026</td><td class="o_cohort_value">12</td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.25);">25%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.583); color:#fff;">58.3%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.75); color:#fff;">75%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.833); color:#fff;">83.3%</div></td>
          </tr>
          <tr class="o_cohort_row_clickable">
            <td class="o_cohort_value">W39 2026</td><td class="o_cohort_value">10</td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.1);">10%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.4);">40%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.6); color:#fff;">60%</div></td>
          </tr>
          <tr class="o_cohort_row_clickable">
            <td class="o_cohort_value">W40 2026</td><td class="o_cohort_value">13</td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,0);">0%</div></td>
            <td><div class="o_cohort_highlight o_cohort_value" style="background-color:rgba(0,160,157,.154);">15.4%</div></td>
          </tr>
        </tbody>
        <tfoot><tr><td>Average</td><td>11.7</td><td>11.7%</td><td>37.9%</td><td>67.5%</td><td>83.3%</td></tr></tfoot>
      </table>
    </div>
  </div>
</div>
