version: 1
display_name: Plan Development
short_description: Plan, build, install, and operationally verify an Odoo addon (adapts to the local IDE/scaffolding convention).
default_prompt: >
  Use the Plan Development skill: read skills/_shared/principles.md and
  skills/odoo-plan-development/reference/troubleshooting.md first, then ask the
  fixed questions one-by-one (instance, version, new vs update, business need,
  solution brief, validation DB). If a fresh instance was named, run
  reference/scripts/_detect_environment.py FIRST — mirror any existing
  sibling-instance convention, otherwise propose the canonical layout and ask.
  Then scaffold the folder + conf and (with explicit user confirmation per
  Pre-Flight A) create the DB and patch any detected IDE config (VS Code /
  Cursor launch.json auto-patched; JetBrains print-only; nothing detected
  means skip — no fallback). Ask only the role questions that materially
  change the outcome. Scaffold the addon under instances/<instance>/<custom_addons_dir>/<module>/.
  Run Stage 1 static lint, Stage 2 install/upgrade, and Stage 3 operational
  smoke; fix any errors and re-run all three stages. Finish with user +
  testing manuals, and append any new failure mode to
  reference/troubleshooting.md.
